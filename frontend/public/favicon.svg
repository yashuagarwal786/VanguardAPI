<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#a3e635" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <!-- Dark container background with neon acid lime border -->
  <rect 
    x="3" 
    y="3" 
    width="58" 
    height="58" 
    rx="15" 
    fill="#0a0a0c" 
    stroke="#a3e635" 
    stroke-width="2.75"
    filter="url(#neon-glow)"
  />

  <!-- High-precision Vanguard Shield Icon -->
  <path 
    d="M32 16.5 C36.5 16.5 44 18.5 44 21.5 C44 32.5 38 41 32 46.5 C26 41 20 32.5 20 21.5 C20 18.5 27.5 16.5 32 16.5 Z" 
    fill="none" 
    stroke="url(#shield-grad)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
